<ion-content [fullscreen]="true" class="auth-bg">
  <div class="auth-page">
    <div class="auth-wrapper">
      <main class="auth-content register-device" [attr.aria-busy]="busy()">
        <ion-icon class="register-device__icon" [name]="icon()" aria-hidden="true"></ion-icon>

        <h1 #heading class="auth-title" tabindex="-1">{{ 'device-registration.title' | translate }}</h1>
        <p class="auth-subtitle">{{ 'device-registration.subtitle' | translate }}</p>

        <form class="register-device__form" [formGroup]="form" (ngSubmit)="register()">
          <div class="auth-field">
            <label class="auth-field__label" for="register-device-name" id="register-device-name-label">
              {{ 'device-registration.name-label' | translate }}
            </label>
            <ion-input
              id="register-device-name"
              formControlName="name"
              aria-labelledby="register-device-name-label"
              aria-describedby="register-device-name-counter"
              type="text"
              autocomplete="off"
              [maxlength]="maxLength"
              class="auth-input"
            ></ion-input>
            <span class="register-device__counter" id="register-device-name-counter" aria-live="polite">
              {{ length() }}/{{ maxLength }}
            </span>
          </div>

          @if (failed()) {
            <div class="error-box" role="alert">
              <ion-icon name="alert-circle-outline" aria-hidden="true"></ion-icon>
              <span>{{ 'device-registration.failed' | translate }}</span>
            </div>
          }

          <button type="submit" class="auth-button" [disabled]="!canContinue()">
            @if (busy()) {
              <ion-spinner name="crescent" class="btn-spinner" aria-hidden="true"></ion-spinner>
              <span class="sr-only">{{ 'device-registration.continue' | translate }}</span>
            } @else if (failed()) {
              {{ 'device-registration.retry' | translate }}
            } @else {
              {{ 'device-registration.continue' | translate }}
            }
          </button>
        </form>
      </main>
    </div>
  </div>
</ion-content>
