<ion-content [fullscreen]="true" class="scan-content">
  <div class="scanner-wrapper">
    <header class="scanner-header">
      <h1 class="scanner-title">{{ "scanner.title" | translate }}</h1>
      <p class="scanner-subtitle">{{ "scanner.subtitle" | translate }}</p>
    </header>

    @if (showScanner) {
      <div class="scanner-viewport">
        <app-barcode-scanner #scanner (qrCode)="qrCodeEmit($event)"></app-barcode-scanner>
        <div class="viewfinder">
          <span class="vf-corner vf-tl"></span>
          <span class="vf-corner vf-tr"></span>
          <span class="vf-corner vf-bl"></span>
          <span class="vf-corner vf-br"></span>
        </div>
      </div>
      <p class="scan-alternative">
        <button type="button" class="scan-link" (click)="stopScanner()">
          {{ "scanner.scan-back" | translate }}
        </button>
      </p>
    } @else {
      <form class="code-entry" (ngSubmit)="submitCode()">
        <label class="field-label" for="scan-code-input">{{ "scanner.manual-label" | translate }}</label>
        <input
          id="scan-code-input"
          name="code"
          class="field-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          [placeholder]="'scanner.manual-placeholder' | translate"
          [ngModel]="code()"
          (ngModelChange)="code.set($event)"
        />
        <button type="submit" class="btn-primary" [disabled]="!trimmedCode">
          {{ "scanner.manual-continue" | translate }}
        </button>
      </form>

      <p class="scan-alternative">
        {{ "scanner.scan-hint" | translate }}
        <button type="button" class="scan-link" (click)="startScanner()">
          {{ "scanner.scan-camera" | translate }}
        </button>
      </p>
    }
  </div>
</ion-content>
