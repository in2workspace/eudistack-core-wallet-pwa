@if (errorCode === WRAP_UNAVAILABLE) {
  <div class="sign-prompt-error-card" role="alert">
    <div class="sign-prompt-error-icon" aria-hidden="true">
      <ion-icon name="alert-circle-outline"></ion-icon>
    </div>

    <h2 class="sign-prompt-error-title">
      {{ 'hybrid-errors.wrap-unavailable-title' | translate }}
    </h2>

    <p class="sign-prompt-error-body">
      {{ 'hybrid-errors.wrap-unavailable-body' | translate }}
    </p>

    <button
      class="sign-prompt-dismiss-btn"
      type="button"
      (click)="dismiss()">
      {{ 'hybrid-errors.wrap-unavailable-cta' | translate }}
    </button>
  </div>
}
