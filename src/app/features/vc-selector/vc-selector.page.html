<ion-content [fullscreen]="true" class="vc-selector-content">
  <div class="vc-selector-header">
    @if (clientLogo) {
      <img [src]="clientLogo" class="header-logo" alt="RP Logo">
    } @else {
      <div class="header-icon">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
      </div>
    }
    <h2 class="header-title">{{ clientName || "vc-selector.presentation-request" | translate }}</h2>
    <p class="header-subtitle">{{ "vc-selector.select-instruction" | translate }}</p>
    @if ( clientUri ) {
      <div class="requester-badge">
        <ion-icon name="globe-outline"></ion-icon>
        <span>{{ clientUri }}</span>
      </div>
    }
  </div>

  <div class="credential-list">
    @for (cred of credList; track cred) {
      <div role="button" class="selectable-card" tabindex="0" (click)="sendCred(cred)" (keydown.enter)="sendCred(cred)" (keydown.space)="$event.preventDefault()" (keyup.space)="sendCred(cred)" [attr.aria-label]="'vc-selector.select-cred' | translate">
        <app-vc-view [credentialInput$]="cred" [enableDetailView$]="false"></app-vc-view>
        <div class="card-action-hint">
          <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
        </div>
      </div>
    }
  </div>
</ion-content>

<ion-footer [translucent]="false">
  <ion-toolbar>
    <ion-button expand="block" fill="outline" color="medium" (click)="goBack()" class="cancel-button">
      {{ "vc-selector.cancel" | translate }}
    </ion-button>
  </ion-toolbar>
</ion-footer>
