sonar.projectKey=in2workspace_eudistack-core-wallet-pwa
sonar.organization=in2workspace

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=eudistack-core-wallet-pwa

# can be replaced with your desired value
sonar.projectVersion=1.0

# Replace path according to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=src

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Files to be Excluded - you may change the folders and files
# todo Review the list of files and folders to be excluded and perform the test if needed
sonar.exclusions=src/environments/**, src/assets/**, src/**/*.spec.ts, src/app/app.routes.ts, src/app/core/constants/**, src/app/features/credentials/credentials.page.ts, src/app/features/tabs/tabs.routes.ts, src/main.ts, src/polyfills.ts, src/zone-flags.ts, **/.DS_Store

# host url
sonar.host.url=https://sonarcloud.io

# report path
sonar.javascript.lcov.reportPaths=./coverage/app/lcov.info
