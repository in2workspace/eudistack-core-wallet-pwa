server 
{
    listen 8080;
    if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
    }

    # Never cache the files the browser uses to decide how to launch the PWA
    # and the Service Worker itself. Stale copies of these cause "zombie SW"
    # problems and break launch_handler / single-instance behaviour.
    location ~* ^/(index\.html|manifest\.webmanifest|ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Expose-Headers Content-Length;
        add_header Access-Control-Allow-Headers Range;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html =404;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Max-Age 3600;
        add_header Access-Control-Expose-Headers Content-Length;
        add_header Access-Control-Allow-Headers Range;
        }
}