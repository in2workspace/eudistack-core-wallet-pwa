name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eudistack-core-wallet-pwa
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: eudistack-core-wallet-pwa

      - name: Checkout platform-dev (canonical schemas)
        uses: actions/checkout@v4
        with:
          repository: in2workspace/eudistack-platform-dev
          token: ${{ secrets.PLATFORM_DEV_READ_TOKEN }}
          path: eudistack-platform-dev
          sparse-checkout: dev-tools/schemas

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: eudistack-core-wallet-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration=development

      - name: Test
        run: npm run test:ci

      - name: Publish Coverage
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: ${{ github.workspace }}/eudistack-core-wallet-pwa/coverage/app/coverage-summary.json
          json-final-path: ${{ github.workspace }}/eudistack-core-wallet-pwa/coverage/app/coverage-final.json

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: eudistack-core-wallet-pwa/coverage/app/
