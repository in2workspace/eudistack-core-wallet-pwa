name: License Gate

# npm variant. No `paths-ignore`: a required check that does not run on a
# documentation-only pull request stays pending forever and blocks the merge
# (EC-07).
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-gate:
    name: License Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify the license gate itself
        run: node --test .github/scripts/license-gate.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npm run sbom

      - name: Evaluate licenses
        run: node .github/scripts/license-gate.mjs --sbom-path build/sbom/sbom.json
