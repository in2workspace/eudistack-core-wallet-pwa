name: PR quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  quality:
    uses: in2workspace/eudistack-devops-workflows/.github/workflows/spa-pr.yml@12ed6fa9090ebd4564c6541b67111ed4466a61b1
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  license-compliance:
    uses: in2workspace/eudistack-devops-workflows/.github/workflows/common-license-gate.yml@12ed6fa9090ebd4564c6541b67111ed4466a61b1
    with:
      setup_java: false
      install_command: npm ci
      sbom_command: npm run sbom
      sbom_path: build/sbom/sbom.json

  analyze:
    uses: in2workspace/eudistack-devops-workflows/.github/workflows/common-codeql-javascript.yml@12ed6fa9090ebd4564c6541b67111ed4466a61b1
